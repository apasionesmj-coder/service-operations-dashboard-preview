<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서비스 운영 현황</title><link rel="stylesheet" href="styles.css">
</head>
<body><main class="shell">
<header><div><p class="eyebrow">PRIVATE OPERATIONS HUB</p><h1>서비스 운영 현황</h1><p class="subtitle">운영 상태와 최근 변경, 다음 작업을 한 화면에서 확인합니다.</p></div><div class="header-status"><div id="collected" class="timestamp" role="status" aria-live="polite">상태를 불러오는 중…</div><button id="refresh" class="refresh" type="button">지금 새로고침</button></div></header>
<section id="summary" class="summary" aria-label="전체 요약"></section>
<nav class="filters" aria-label="서비스 필터"><button class="filter active" aria-pressed="true" data-filter="all">전체</button><button class="filter" aria-pressed="false" data-filter="operating">운영 중</button><button class="filter" aria-pressed="false" data-filter="planned">예정</button><button class="filter" aria-pressed="false" data-filter="attention">확인 필요</button></nav>
<section class="layout"><div><div class="section-heading"><h2>서비스</h2><span id="service-count"></span></div><section id="services" class="services" aria-live="polite"></section></div><aside><section class="panel"><h2>최근 업데이트</h2><div id="updates"></div></section><section class="panel" aria-labelledby="ideas-title"><h2 id="ideas-title">아이디어·계획</h2><div id="ideas"></div></section><section class="panel"><h2>다음 작업</h2><div id="next-actions"></div></section><section class="panel"><h2>확인 필요</h2><div id="attention"></div></section></aside></section>
<footer>v1 · 상태는 읽기 전용 수집 결과이며, 아이디어·계획 GUI는 Notion 연동 단계에서 추가됩니다.</footer>
</main><script src="app.js"></script></body></html>
