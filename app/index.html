<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서비스 운영 현황 · Preview</title><link rel="stylesheet" href="styles.css">
</head>
<body><main class="shell">
<header><div><p class="eyebrow">SERVICE OPERATIONS HUB · PREVIEW</p><h1>서비스 운영 현황</h1><p class="subtitle">샘플 데이터로 화면과 흐름을 확인하는 공개 Preview입니다.</p></div><div class="header-status"><div id="collected" class="timestamp" role="status" aria-live="polite">상태를 불러오는 중…</div><button id="refresh" class="refresh" type="button">지금 새로고침</button></div></header>
<section id="summary" class="summary" aria-label="전체 요약"></section>
<nav class="filters" aria-label="서비스 필터"><button class="filter active" aria-pressed="true" data-filter="all">전체</button><button class="filter" aria-pressed="false" data-filter="operating">운영 중</button><button class="filter" aria-pressed="false" data-filter="planned">예정</button><button class="filter" aria-pressed="false" data-filter="attention">확인 필요</button></nav>
<section class="layout"><div><div class="section-heading"><h2>서비스</h2><span id="service-count"></span></div><section id="services" class="services" aria-live="polite"></section></div><aside><section class="panel"><h2>최근 업데이트</h2><div id="updates"></div></section><section class="panel"><h2>다음 작업</h2><div id="next-actions"></div></section><section class="panel"><h2>확인 필요</h2><div id="attention"></div></section></aside></section>
<footer>Preview · 실제 운영 상태가 아닌 샘플 데이터입니다.</footer>
</main><script src="app.js"></script></body></html>
